name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: test
    # Only run semantic-release on the canonical repo, never on forks. A fork's
    # push-to-main (e.g. updating a PR branch) would otherwise run the release
    # and commit a version bump onto the PR head — regressing the version and
    # re-introducing merge conflicts against upstream.
    #
    # Keyed on the fork flag rather than a hardcoded owner/name, so a transfer
    # or rename cannot silently turn this job into a no-op. A skipped job does
    # not fail its run, so a stale slug here stops every release while the
    # workflow keeps reporting success — there is no signal anywhere.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install semantic-release
        run: >-
          npm install -g
          semantic-release@25.0.3
          @semantic-release/changelog@6.0.3
          @semantic-release/git@10.0.1
          @semantic-release/github@12.0.8
          @semantic-release/exec@7.1.0

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
