name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # `optimize` is named explicitly: it is a git-pinned extra and so is
        # kept out of `all`. Without it the cap_evolve-guarded tests in
        # tests/test_capevolve_poc.py skip, and the bridge is never checked
        # against the real contract it is written to.
        run: pip install -e ".[all,optimize,test]"

      - name: Run tests
        run: pytest tests/ -v
