name: docs

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "mkdocs.yml"
      - "agent_eval/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only build/publish docs from the canonical repo — never on forks (a fork's
    # push to main would otherwise try to publish to the fork's GitHub Pages).
    # Keyed on the fork flag rather than a hardcoded owner/name so a transfer or
    # rename cannot silently stop publishing; see release.yml for the rationale.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ github.sha }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # `-e .` makes agent_eval importable so mkdocstrings can autodoc it.
      - run: pip install -e . -r website/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
