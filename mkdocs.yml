# Generated scaffold — the nav block is produced from tmp/gen_docs.py.
# Re-run that generator (or edit nav here directly once content stabilizes).
site_name: Agent Eval Harness
site_description: >-
  A generic evaluation framework for skills and agent capabilities — analyze, build a
  dataset, run, score with LLM and code judges, and improve, all from one declarative eval.yaml.
site_url: https://fullsend-ai.github.io/agent-eval-harness/
repo_url: https://github.com/fullsend-ai/agent-eval-harness
repo_name: fullsend-ai/agent-eval-harness
edit_uri: edit/main/website/
docs_dir: website
copyright: Copyright &copy; Red Hat, Inc. — Licensed under Apache-2.0

theme:
  name: material
  custom_dir: website/overrides
  logo: assets/images/aeh-logo.png
  favicon: assets/images/favicon.png
  # Fonts are self-hosted (see website/stylesheets/extra.css); disable the
  # Google Fonts CDN loader.
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Repo-root includes (e.g. CHANGELOG.md on whats-new.md); fail the
      # build on a missing file rather than silently rendering nothing.
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # Python API autodoc. Enabled in CI (which runs `pip install -e .`).
  # Add `::: agent_eval.<module>` directives on reference/python-api.md to use it.
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            separate_signature: true
            merge_init_into_class: true
  # LLM-friendly export: generates /llms.txt (index) and /llms-full.txt
  # (full concatenated docs) for coding agents / LLMs.
  - llmstxt:
      markdown_description: >-
        A generic evaluation framework for skills and agent capabilities, driven by a
        single declarative eval.yaml — drive any agent harness (Claude Code, OpenCode, Pi, etc),
        run locally or on the Harbor and EvalHub backends, export rewards for RL training,
        and record traces, datasets, and reports in MLflow.
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md
          - get-started/*.md
        Guides:
          - guides/*.md
        Concepts:
          - concepts/*.md
        Reference:
          - reference/*.md
          - reference/config/*.md
        Cookbook:
          - cookbook/*.md
        What's new:
          - whats-new.md

extra_css:
  - stylesheets/extra.css
  - stylesheets/diagrams.css

extra_javascript:
  - assets/javascripts/harbor-diagram.js
  - assets/javascripts/loop-diagram.js
  - assets/javascripts/toc-rail.js
  - assets/javascripts/table-wrap.js
  - assets/javascripts/card-glow.js
  - assets/javascripts/card-nav.js

extra:
  # "Was this page helpful?" widget. Ratings are recorded only if an analytics
  # provider is configured; without one, the widget still renders and the note
  # (with an issue link) is shown after a click.
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for the feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks — please
            <a href="https://github.com/fullsend-ai/agent-eval-harness/issues/new" target="_blank" rel="noopener">open an issue</a>
            so we can improve this page.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fullsend-ai/agent-eval-harness

