# This file is managed by 'fullsend repos': repos-config-v1
# Do not edit this file directly; changes will be overwritten.
version: "1"
runtime: claude
agents:
    - name: code
      runtime: claude
      model: opus
    - name: fix
      model: sonnet
    - name: prioritize
      runtime: pi
      model: google-vertex/gemini-3.8-flash
    - name: review
      runtime: pi
      model: sonnet
      subagents:
        challenger: opus
        correctness: gateway/gpt-6.1-sol
        docs-currency: google-vertex/gemini-3.8-flash
        intent-coherence: google-vertex/gemini-3.8-flash
        risk-assessment: google-vertex/gemini-3.8-flash
        security: gateway/gpt-6.1-sol
        style-conventions: google-vertex/gemini-3.8-flash
    - name: retro
      enabled: false
      model: sonnet
    - name: triage
      model: sonnet
create_issues:
    allow_targets:
        orgs:
            - fullsend-ai
status_notifications:
    reaction:
        start: enabled
        completion: enabled
inference:
    gateway:
        url: https://fullsend-inference-gateway-155031062349.us-central1.run.app
        audience: fullsend-inference-gateway
        models:
            gpt-6.1-sol:
                api: openai-responses
